name: Build & test
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
env:
  OPENSEARCH_DASHBOARDS_VERSION: 'main'

jobs:
  Get-CI-Image-Tag:
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@main
    with:
      product: opensearch-dashboards

  build-and-test-linux:
    if: ${{ github.event.label.name != 'rapid' }}
    needs: Get-CI-Image-Tag
    name: Build & test
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: --user root

    steps:
      - name: Checkout OpenSearch Dashboards
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: opensearch-project/OpenSearch-Dashboards
          ref: ${{ env.OPENSEARCH_DASHBOARDS_VERSION }}
          path: OpenSearch-Dashboards
      - name: Checkout plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: OpenSearch-Dashboards/plugins/dashboards-flow-framework
      - name: Bootstrap / build / unit test the plugin
        run: |
          chown -R 1000:1000 `pwd`
          cd ./OpenSearch-Dashboards/
          su `id -un 1000` -c "source $NVM_DIR/nvm.sh && nvm use && node -v && yarn -v &&
                               cd ./plugins/dashboards-flow-framework &&
                               whoami && yarn osd bootstrap && yarn build && yarn run test:jest --coverage"
      - name: Upload coverage report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jest-coverage-report
          path: OpenSearch-Dashboards/plugins/dashboards-flow-framework/coverage
          retention-days: 1
          if-no-files-found: error

  upload-coverage:
    needs: build-and-test-linux
    name: Upload coverage report to Codecov
    if: ${{ !cancelled() && github.repository == 'opensearch-project/dashboards-flow-framework' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download coverage report
        id: download-coverage
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jest-coverage-report
          path: coverage

      - name: Uploads coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: steps.download-coverage.outcome == 'success'
        with:
          directory: coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  build-and-test-macos:
    if: ${{ github.event.label.name != 'rapid' }}
    name: Build & test
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout OpenSearch Dashboards
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: opensearch-project/OpenSearch-Dashboards
          ref: ${{ env.OPENSEARCH_DASHBOARDS_VERSION }}
          path: OpenSearch-Dashboards
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: './OpenSearch-Dashboards/.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
          cache-dependency-path: './OpenSearch-Dashboards/**/yarn.lock'
      - name: Install Yarn
        shell: bash
        run: |
          YARN_VERSION=$(node -p "require('./OpenSearch-Dashboards/package.json').engines.yarn")
          echo "Installing yarn@$YARN_VERSION"
          npm i -g yarn@$YARN_VERSION
      - run: node -v
      - run: yarn -v
      - name: Checkout plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: OpenSearch-Dashboards/plugins/dashboards-flow-framework
      - name: Bootstrap the plugin
        run: |
          cd OpenSearch-Dashboards/plugins/dashboards-flow-framework
          yarn osd bootstrap
      - name: Build the plugin
        run: |
          cd OpenSearch-Dashboards/plugins/dashboards-flow-framework
          yarn build
      - name: Run unit tests
        run: |
          cd OpenSearch-Dashboards/plugins/dashboards-flow-framework
          yarn run test:jest --coverage
